name = "taskcompiler"
main = "src/worker.ts"
compatibility_date = "2026-04-17"
compatibility_flags = ["nodejs_compat"]

routes = [
	{ pattern = "taskcompiler.com", custom_domain = true },
	{ pattern = "www.taskcompiler.com", custom_domain = true }
]

# Plain-text vars (non-secret). Override at runtime with `wrangler secret put`
# of the same name — the secret takes precedence over the value here.
[vars]
EMAIL_FROM = "TaskCompiler <noreply@taskcompiler.com>"

# The `typescript` compiler is bundled by the agent-code typecheck service
# (src/lib/server/agent/typecheck/service.ts). Its CJS init code uses `__filename`
# and `__dirname` as lexical identifiers to feature-detect its Node sys host,
# which Workers doesn't define. Substitute harmless placeholders at bundle
# time — the code paths that consume them only matter for Node's real fs
# layer, which our in-memory LanguageServiceHost never invokes.
[define]
"__filename" = "\"/worker.js\""
"__dirname" = "\"/\""

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "taskcompiler-dev"
database_id = "af8b678f-2108-4d3f-b7e2-092a971c94f7"

[[dispatch_namespaces]]
binding = "DISPATCHER"
namespace = "taskcompiler-workflows"

[[workflows]]
name = "taskcompiler-generate"
binding = "GEN_WORKFLOW"
class_name = "GenerateWorkflowFlow"

[[workflows]]
name = "taskcompiler-heal"
binding = "HEAL_WORKFLOW"
class_name = "HealWorkflowFlow"

# Cloudflare Email Service binding (the newer transactional product, beta as
# of 2026-04). `remote = true` opts in — without it the binding falls back to
# legacy Email Routing, which can only reach verified destination addresses.
# Requires the sender domain to be onboarded via dashboard → Email → Email
# Sending → Onboard Domain (auto-adds MX/SPF/DKIM/DMARC on cf-bounce.<domain>).
# Workers Paid plan is required to send to arbitrary recipients.
[[send_email]]
name = "EMAIL"
remote = true

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
