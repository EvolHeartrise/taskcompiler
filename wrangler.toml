# D1 setup:
#   Remote: `bunx wrangler d1 create taskcompiler-dev` then paste the returned
#   `database_id` below. Apply schema with `bunx wrangler d1 migrations apply taskcompiler-dev --remote`.
#   Local:  wrangler auto-creates a local D1 under `.wrangler/state/` on first `wrangler dev`.
#   Apply migrations locally with `bunx wrangler d1 migrations apply taskcompiler-dev --local`.

name = "taskcompiler"
main = "src/worker.ts"
compatibility_date = "2026-04-17"
compatibility_flags = ["nodejs_compat"]

# The `typescript` compiler is bundled by the agent-code typecheck service
# (src/lib/server/agent/typecheck/service.ts). Its CJS init code uses `__filename`
# and `__dirname` as lexical identifiers to feature-detect its Node sys host,
# which Workers doesn't define. Substitute harmless placeholders at bundle
# time — the code paths that consume them only matter for Node's real fs
# layer, which our in-memory LanguageServiceHost never invokes.
[define]
"__filename" = "\"/worker.js\""
"__dirname" = "\"/\""

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "taskcompiler-dev"
database_id = "af8b678f-2108-4d3f-b7e2-092a971c94f7"

[[dispatch_namespaces]]
binding = "DISPATCHER"
namespace = "runely-workflows"

[[workflows]]
name = "runely-generate"
binding = "GEN_WORKFLOW"
class_name = "GenerateWorkflowFlow"

[[workflows]]
name = "runely-heal"
binding = "HEAL_WORKFLOW"
class_name = "HealWorkflowFlow"

# Cloudflare Email Sending. No-op until a verified sender domain exists
# (EMAIL_FROM secret) and that domain's DNS is on Cloudflare. The binding
# is safe to declare with no domain yet — send() throws, and auth.ts logs
# the magic link to wrangler tail as a fallback.
[[send_email]]
name = "EMAIL"

[triggers]
crons = ["* * * * *"]

# Workers Observability (https://developers.cloudflare.com/workers/observability/logs/workers-logs/).
# `head_sampling_rate = 1` keeps 100% of invocations (no sampling); drop below 1
# to sample if the log volume grows. `invocation_logs = true` keeps the
# built-in per-invocation summary line alongside our structured events.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
